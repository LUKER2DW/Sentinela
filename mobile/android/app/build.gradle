apply plugin: 'com.android.application'

android {
    namespace = "casa.sentinela.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "casa.sentinela.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The house's public address shown on the start screen (ADR-0019);
        // set when building (scripts/build-apk.sh), not in git.
        buildConfigField "String", "DOMAIN_URL", "\"${System.getenv('SENTINELA_DOMAIN_URL') ?: ''}\""
        // SHA-256 of the public address's self-signed certificate (hex), the
        // only untrusted certificate the app accepts (Pin.java). Printed by
        // `sudo /opt/sentinela/scripts/setup-public.sh status` on the server.
        buildConfigField "String", "PUBLIC_CERT_SHA256", "\"${System.getenv('SENTINELA_PUBLIC_CERT_SHA256') ?: ''}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing key lives OUTSIDE the repo in ~/.sentinela-android/
    // (created by scripts/build-apk.sh; back it up). Android Studio and the
    // script sign with the same key, so a release APK installs over the
    // app already on the phone.
    def ksDir = new File(System.getenv("SENTINELA_KEYSTORE_DIR") ?: new File(System.getProperty("user.home"), ".sentinela-android").path)
    def ks = new File(ksDir, "release.jks")
    def ksPass = new File(ksDir, "keystore.pass")
    if (ks.exists() && ksPass.exists()) {
        signingConfigs {
            release {
                storeFile ks
                storePassword ksPass.text.trim()
                keyAlias "sentinela"
                keyPassword ksPass.text.trim()
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ks.exists() && ksPass.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // "Run" in Android Studio installs this one: its own app id and name
        // ("Sentinela (dev)", src/debug/res), so it lives next to the real
        // app, and its WebView can be inspected at chrome://inspect.
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

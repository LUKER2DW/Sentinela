<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sentinela</title>
    <style>
      :root { --bg: #f5f2ec; --text: #1f2a30; --muted: #5f6d74; --sea: #3e7c88; --ink: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161a1c; --text: #ece9e3; --muted: #a4acaf; --sea: #8fc6c3; --ink: #0f2b2e; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 22rem; display: grid; gap: 16px; justify-items: center; }
      svg { width: 96px; height: 96px; color: var(--sea); }
      h1 { margin: 0; font: 600 1.6rem/1.2 Georgia, serif; }
      p { margin: 0; color: var(--muted); }
      .btn { display: block; width: 100%; height: 48px; border-radius: 14px; border: 0; font: 600 1rem system-ui, sans-serif; text-decoration: none; line-height: 48px; }
      .primary { background: var(--sea); color: var(--ink); }
      .ghost { background: transparent; color: var(--text); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); line-height: 46px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19.4 17.5 19.3 12.4Q24 11.3 28.7 12.5L28.6 17.5" /><path d="M17.8 12.7 24 7.3 30.2 12.8" />
        <path d="M19.7 17.8 17 36.5M28.3 17.8 31.2 36.6" /><path d="M18.6 27.3Q24 26.2 29.6 27.5" />
        <path d="M8 40.5q4-3 8 0t8 0 8 0 8 0" />
      </svg>
      <h1>Sem conexão com a casa</h1>
      <p>O Sentinela só abre pelo Tailscale. Ligue a VPN do Tailscale neste celular e tente de novo.</p>
      <a class="btn primary" href="intent://#Intent;package=com.tailscale.ipn;end">Abrir o Tailscale</a>
      <button class="btn ghost" onclick="location.replace(window.SENTINELA_URL || '/')">Tentar de novo</button>
    </main>
    <script>
      // The error page runs from the bundle; go back to the server's origin.
      window.SENTINELA_URL = (window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl()) || "/";
    </script>
  </body>
</html>

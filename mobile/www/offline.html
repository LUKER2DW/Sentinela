<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sentinela</title>
    <!-- Shown by Capacitor when the chosen server does not answer. Same
         lighthouse panorama as the web sign-in (art/, exported from web/). -->
    <link rel="stylesheet" href="art/panorama.css" />
    <link rel="stylesheet" href="scene.css" />
    <style>
      :root { --on-sea: #fff; }
      :root[data-theme="dark"] { --on-sea: #0f2b2e; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body { margin: 0; display: grid; grid-template-rows: minmax(160px, 1fr) auto; height: 100dvh; background: var(--bg); color: var(--text);
        font: 16px/1.5 "Figtree Variable", system-ui, sans-serif; overflow: hidden; }
      main { position: relative; z-index: 1; margin: -56px auto 0; width: min(26rem, 100%); padding: 0 16px calc(20px + env(safe-area-inset-bottom));
        display: grid; gap: 12px; text-align: center; }
      .card { display: grid; gap: 10px; padding: 18px 16px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 92%, transparent);
        border: 1px solid var(--line); box-shadow: 0 1px 2px rgb(31 42 48 / 0.06), 0 18px 40px -18px rgb(31 42 48 / 0.35); backdrop-filter: blur(10px); }
      h1 { margin: 0; font: 500 2rem/1.15 "Fraunces Variable", Georgia, serif; font-variation-settings: "SOFT" 100, "opsz" 48; letter-spacing: -0.01em; }
      p { margin: 0 0 4px; color: var(--muted); }
      .btn { display: block; width: 100%; height: 48px; border-radius: 14px; border: 0; font: 600 1rem "Figtree Variable", system-ui, sans-serif;
        text-decoration: none; line-height: 48px; cursor: pointer; transition: transform 0.12s; }
      .btn:active { transform: scale(0.97); }
      .primary { background: var(--sea); color: var(--on-sea); }
      .ghost { background: transparent; color: var(--text); border: 1px solid var(--line-strong); line-height: 46px; }
    </style>
  </head>
  <body>
    <div class="scene hero"></div>
    <main>
      <h1 class="rise">Sem conexão com a casa</h1>
      <div class="card rise">
        <p id="why">O servidor não respondeu por este caminho. Tente de novo ou troque a forma de conexão.</p>
        <button class="btn primary" onclick="location.replace(window.SENTINELA_URL || '/')">Tentar de novo</button>
        <button class="btn ghost" id="change">Trocar forma de conexão</button>
        <a class="btn ghost" id="ts" hidden href="intent://#Intent;package=com.tailscale.ipn;end">Abrir o Tailscale</a>
      </div>
    </main>
    <script src="art/panorama.js"></script>
    <script src="scene.js"></script>
    <script>
      // The error page runs from the bundle; go back to the server's origin.
      window.SENTINELA_URL = (window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl()) || "/";
      // Start screen and per-path hints (ADR-0019, ConnectionPlugin).
      const cap = window.Capacitor;
      const conn = (m) => cap.nativePromise("SentinelaConnection", m, {});
      document.getElementById("change").onclick = () => conn("change");
      if (cap && cap.nativePromise) {
        conn("get").then((s) => {
          const why = document.getElementById("why");
          if (s.mode === "tailscale") {
            why.textContent = "Este caminho usa o app do Tailscale. Ligue a VPN do Tailscale neste celular e tente de novo.";
            document.getElementById("ts").hidden = false;
          } else if (s.mode === "tailnet") {
            why.textContent = "A rede privada do app ainda não conectou (" + s.tailnetStatus + "). Confira a internet e tente de novo.";
          }
        });
      }
    </script>
  </body>
</html>

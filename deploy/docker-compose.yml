# Sentinela v2 stack: go2rtc (live), recorder (sentinela record), API/UI
# (sentinela serve). Host networking: WebRTC ICE and camera access need no
# NAT juggling; every listener is bound explicitly (docs/ARCHITECTURE.md §4).
#
#   sudo docker compose -f deploy/docker-compose.yml up -d --build
#
# Secrets: /etc/sentinela/secrets.env (0600). Config: /etc/sentinela/config.yaml.

name: sentinela

x-sentinela: &sentinela
  build:
    context: ..
    args:
      VERSION: ${SENTINELA_VERSION:-dev}
  image: sentinela:local
  network_mode: host
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file: /etc/sentinela/secrets.env
  environment:
    TZ: UTC
  volumes:
    - /etc/sentinela/config.yaml:/etc/sentinela/config.yaml:ro
    - /data:/data
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: /etc/sentinela/secrets.env
    # cam1 lives in go2rtc.yaml; cameras added with scripts/add-camera.sh are
    # generated into /etc/sentinela/go2rtc-cameras.yaml (never overwritten by
    # a deploy). go2rtc merges both files.
    command: ["go2rtc", "-config", "/config/go2rtc.yaml", "-config", "/config/cameras.yaml"]
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
      - /etc/sentinela/go2rtc-cameras.yaml:/config/cameras.yaml:ro
    tmpfs: [/tmp]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # UnifiedPush relay for the Android app's notifications (ADR-0013).
  # Loopback only (deploy/ntfy/server.yml); published on the tailnet by
  # `tailscale serve --https=8443`. Nothing else depends on it.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    command: ["serve"]
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: UTC
      GOMEMLIMIT: 40MiB
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - /data/ntfy:/var/cache/ntfy
    tmpfs: [/tmp]
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Independent of the API and go2rtc (ADR-0007): pulls RTSP from the camera.
  recorder:
    <<: *sentinela
    command: ["record"]
    environment:
      TZ: UTC
      GOMEMLIMIT: 48MiB
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 256m

  sentinela:
    <<: *sentinela
    command: ["serve"]
    environment:
      TZ: UTC
      # Soft limit: after a login (argon2id, 64 MB) the heap is returned to
      # the OS promptly, keeping steady-state RSS inside the 80 MB budget.
      GOMEMLIMIT: 72MiB
    volumes:
      - /etc/sentinela/config.yaml:/etc/sentinela/config.yaml:ro
      - /data:/data
      # Nuvem file API (ADR-0012): read-write, confined with os.Root. UID 1000
      # owns the share, as Samba's account does. The recorder has no access.
      - /srv/nas:/srv/nas
      # Read-only, only to report free space of the backup disk (ADR-0014).
      - /srv/backup:/srv/backup:ro
      # SMART and backup status written by host timers (disk-health.sh, backup.sh).
      - /var/lib/sentinela:/host:ro
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "/usr/local/bin/sentinela", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

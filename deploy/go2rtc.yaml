# go2rtc config. Camera address and credentials come from env
# (/etc/sentinela/secrets.env; ${VAR} is expanded by go2rtc).
# The camera firmware reads user/password literally from the RTSP path.
api:
  listen: "127.0.0.1:1984"      # loopback only; sentinela proxies with tickets
  origin: ""                   # no CORS
rtsp:
  listen: "127.0.0.1:8554"      # internal restream only
webrtc:
  # ICE on all interfaces (LAN now, tailscale0 later). No external STUN:
  # go2rtc advertises its host addresses, which is all a LAN/tailnet needs.
  listen: ":8555"
  # Extra ICE candidates for the ADR-0019 trial (host candidates stay):
  # - stun:8555 — the home's public IP (outbound STUN at start), for browsers
  #   outside reaching the router's 8555 forward (P1);
  # - 127.0.0.1:8555 — the Android app's local forwarder into its embedded
  #   tailnet node (P2). Elsewhere nothing answers there and ICE moves on.
  candidates:
    - stun:8555
    - 127.0.0.1:8555
log:
  level: info

# Keep the main stream connected so the live view opens without waiting for
# the camera's RTSP handshake (only the ≤2 s keyframe wait is left). Costs one
# of the camera's 3 RTSP sessions all the time: recorder + this + the SD
# stream while someone watches it. Nothing else may pull RTSP (docs/CAMERA.md).
preload:
  cam1: "video&audio"

streams:
  # Main: H.265 2560x1440 + PCMA. The dvrip source only connects when a
  # viewer talks (backchannel=1): two-way audio through the camera speaker.
  cam1:
    - rtsp://${CAM1_HOST}:554/user=${CAM1_USER}&password=${CAM1_PASS}&channel=1&stream=0.sdp?real_stream
    - dvrip://${CAM1_USER}:${CAM1_PASS}@${CAM1_HOST}:34567?channel=0&subtype=0&backchannel=1
  # Sub: H.265 800x448 for grids and phones on mobile data.
  cam1_sub:
    - rtsp://${CAM1_HOST}:554/user=${CAM1_USER}&password=${CAM1_PASS}&channel=1&stream=1.sdp?real_stream

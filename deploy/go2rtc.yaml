# go2rtc config. Credentials come from env (${VAR} is expanded by go2rtc).
# Phase 3: this file is generated by sentinela from the DB.
api:
  listen: "127.0.0.1:1984"      # never expose; sentinela proxies with tickets
  origin: ""                   # no CORS
rtsp:
  listen: "127.0.0.1:8554"      # internal restream only
webrtc:
  listen: ":8555"              # ICE (LAN + tailscale0); firewall blocks the rest
  candidates:
    - stun:8555                # let go2rtc discover LAN/tailnet addresses
log:
  level: info

streams:
  # Main (H.265 2560x1440 + PCMA). #backchannel enables talk via DVRIP.
  cam1:
    - rtsp://${CAM1_USER}:${CAM1_PASS}@192.168.1.20:554/user=${CAM1_USER}&password=${CAM1_PASS}&channel=1&stream=0.sdp?real_stream
    - dvrip://${CAM1_USER}:${CAM1_PASS}@192.168.1.20:34567?channel=0&subtype=0&backchannel=1
  # Sub stream for grids / mobile data saving
  cam1_sub:
    - rtsp://${CAM1_USER}:${CAM1_PASS}@192.168.1.20:554/user=${CAM1_USER}&password=${CAM1_PASS}&channel=1&stream=1.sdp?real_stream

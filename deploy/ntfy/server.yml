# ntfy: UnifiedPush relay for notifications in the Android app (ADR-0013).
# Loopback only. Phones reach it over the tailnet through
# `tailscale serve --https=8443 http://127.0.0.1:2586` (scripts/setup-ntfy.sh);
# the Sentinela server publishes to 127.0.0.1:2586 directly. Messages are
# RFC 8291-encrypted by the server: ntfy only relays ciphertext.
#
# No accounts: the tailnet ACL decides who can connect at all, and
# UnifiedPush topics are random, unguessable names ("up" + id).
listen-http: "127.0.0.1:2586"
# `tailscale serve` adds X-Forwarded-For; only local processes can reach
# this port, so the header is trustworthy.
behind-proxy: true
# Messages wait here while the phone is offline (e.g. Tailscale off).
cache-file: /var/cache/ntfy/cache.db
cache-duration: 12h
web-root: disable
enable-signup: false
enable-login: false
# The Sentinela server itself (bursts of events) is never rate limited.
visitor-request-limit-exempt-hosts: "127.0.0.1"
log-level: warn

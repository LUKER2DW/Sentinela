# Sentinela LAN file server (ADR-0008). Installed as /etc/samba/smb.conf by
# scripts/setup-nas.sh. LAN only; one account (ana).
[global]
   server role = standalone server
   workgroup = WORKGROUP
   netbios name = SENTINELA
   server string = Sentinela
   security = user
   map to guest = never
   restrict anonymous = 2
   usershare allow guests = no

   # LAN only (Tailscale interface can be added later).
   interfaces = lo eno1
   bind interfaces only = yes
   hosts allow = 127. 192.168.1.
   hosts deny = 0.0.0.0/0

   server min protocol = SMB2_10
   # Negotiated, not forced: full gigabit on the old i5 (LAN only).
   server signing = default
   server smb encrypt = if_required

   # Throughput
   use sendfile = yes
   min receivefile size = 16384
   aio read size = 1
   aio write size = 1
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   strict sync = no
   getwd cache = yes

   # macOS / iOS friendliness
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   max log size = 2000

[Nuvem]
   comment = Arquivos da casa
   path = /srv/nas
   valid users = ana
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775
   veto files = /lost+found/
   hide files = /lost+found/
   # Recycle bin (ADR-0014): deletes go to .lixeira/<user>/ with their
   # folders; purged after 30 days by sentinela-trash.timer. The web file
   # API (ADR-0012) uses the same place.
   vfs objects = recycle catia fruit streams_xattr
   recycle:repository = .lixeira/%U
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:directory_mode = 0775
   recycle:exclude = *.tmp,~$*,.~lock*
   recycle:exclude_dir = .lixeira
   recycle:maxsize = 0

[Gravacoes]
   comment = Gravacoes das cameras (somente leitura)
   path = /data/recordings
   valid users = ana
   read only = yes
   browseable = yes

# Releases (ADR-0022): a version tag (v1.2.3) builds, from that commit,
#  - the generic Android APK, signed with the app's key (the "release"
#    environment's secrets; nothing else in CI can read them), plus app.json
#    for the servers' update mirror;
#  - the server image, pushed to GitHub Packages (ghcr.io) with an SBOM and
#    build provenance, and a Linux binary;
#  - the GitHub release with notes and checksums.
# No deploy and no server secrets. Only the public repository releases.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'LUKER2DW/Sentinela'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Signing key and optional Firebase config (from the environment's secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] ||
            { echo "::error::Set ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD in the release environment (docs/RELEASING.md)"; exit 1; }
          ks="$RUNNER_TEMP/android"
          install -d -m 700 "$ks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$ks/keystore.pass"
          chmod 600 "$ks/release.jks" "$ks/keystore.pass"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$ks/google-services.json"
            echo "SENTINELA_GOOGLE_SERVICES_JSON=$ks/google-services.json" >> "$GITHUB_ENV"
          fi
          echo "SENTINELA_KEYSTORE_DIR=$ks" >> "$GITHUB_ENV"
      - name: Version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          IFS=. read -r major minor patch <<< "$v"
          echo "SENTINELA_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "SENTINELA_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Build and sign the generic APK
        env:
          SENTINELA_GENERIC_APK: "1"
        run: ./scripts/build-apk.sh
      - name: app.json for the servers' update mirror
        env:
          TAG: ${{ github.ref_name }}
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          mkdir -p out
          cp mobile/build/sentinela.apk out/
          size=$(stat -c %s out/sentinela.apk)
          sha=$(sha256sum out/sentinela.apk | cut -d' ' -f1)
          printf '{"version_code":%s,"version_name":"%s","size":%s,"sha256":"%s","notes":"Sentinela %s: %s"}\n' \
            "$SENTINELA_VERSION_CODE" "$SENTINELA_VERSION_NAME" "$size" "$sha" "$TAG" "$URL" > out/app.json
          cat out/app.json
          rm -rf "$SENTINELA_KEYSTORE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/
          retention-days: 1

  release:
    needs: android
    if: github.repository == 'LUKER2DW/Sentinela'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write      # create the release
      packages: write      # push to ghcr.io
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: android-out

      - name: Checks (same as CI)
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run lint && npm test && npm run build)
          go vet ./... && go test ./...

      - name: Linux binary (web app embedded)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" -o dist/sentinela ./cmd/sentinela
          tar -C dist -czf "dist/sentinela_${VERSION}_linux_amd64.tar.gz" sentinela
          rm dist/sentinela
          cp android-out/sentinela.apk android-out/app.json dist/
          (cd dist && sha256sum ./*.tar.gz ./sentinela.apk > SHA256SUMS)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/luker2dw/sentinela
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/luker2dw/sentinela
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "Sentinela $TAG" ${prev:+--notes-start-tag "$prev"}

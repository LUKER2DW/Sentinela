# Releases (ADR-0022): a version tag (v1.2.3) builds the server image and
# a Linux binary from that commit, publishes the image to GitHub Packages
# (ghcr.io) with build provenance, and creates the GitHub release with notes
# and checksums. It uses only the workflow's own GITHUB_TOKEN: no deploy,
# no server secrets, no signing keys (the APK is signed and attached by the
# maintainer, see docs/RELEASING.md). Only the public repository releases.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'LUKER2DW/Sentinela'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write      # create the release
      packages: write      # push to ghcr.io
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Checks (same as CI)
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run lint && npm test && npm run build)
          go vet ./... && go test ./...

      - name: Linux binary (web app embedded)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" -o dist/sentinela ./cmd/sentinela
          tar -C dist -czf "dist/sentinela_${VERSION}_linux_amd64.tar.gz" sentinela
          rm dist/sentinela
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/luker2dw/sentinela
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/luker2dw/sentinela
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "Sentinela $TAG" ${prev:+--notes-start-tag "$prev"}

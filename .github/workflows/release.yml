# Releases (ADR-0022): a version tag (v1.2.3) builds, from that commit,
#  - the generic Android APK, built without any key, then signed with the
#    app's key in a job of its own (the "release" environment's secrets; no
#    other job, and no npm or Gradle code, can read them), plus app.json for
#    the servers' update mirror;
#  - the server image, pushed to GitHub Packages (ghcr.io) with an SBOM and
#    build provenance, and a Linux binary;
#  - the GitHub release with notes and checksums.
# No deploy and no server secrets. Only the public repository releases.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'LUKER2DW/Sentinela'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Before anything is built (the hosted settings in docs/RELEASING.md
      # protect the key; this refuses what a reviewer could miss): the tag is
      # a plain vMAJOR.MINOR.PATCH without leading zeros (the version code is
      # MAJOR*10000+MINOR*100+PATCH, so MINOR and PATCH stay under 100), its
      # commit is on main (the remote branch, named in full: a tag or branch
      # called "origin/main" cannot stand in for it), it is newer than every
      # published release and it contains the latest one, so old code cannot
      # be signed again under a higher version.
      - name: Tag is a new plain version on main
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          re='^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'
          code() { [[ "$1" =~ $re ]] && echo $((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3])); }
          this="$(code "$TAG")" ||
            { echo "::error::tag must look like v1.2.3 (no leading zeros; minor and patch up to 99)"; exit 1; }
          sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          [[ "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" == "$sha" ]] ||
            { echo "::error::refs/tags/$TAG is not the commit being built"; exit 1; }
          main="$(git rev-parse --verify "refs/remotes/origin/main^{commit}")"
          git merge-base --is-ancestor "$sha" "$main" ||
            { echo "::error::the tagged commit is not on main"; exit 1; }
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft | not) | .tag_name')"
          best="" bestcode=-1
          while read -r t; do
            c="$(code "$t")" || continue
            if ((c > bestcode)); then best="$t" bestcode="$c"; fi
          done <<< "$releases"
          if [[ -n "$best" ]]; then
            ((this > bestcode)) || { echo "::error::$TAG is not newer than the published $best"; exit 1; }
            prev="$(git rev-parse --verify "refs/tags/${best}^{commit}")" ||
              { echo "::error::the tag of the latest release ($best) is missing"; exit 1; }
            git merge-base --is-ancestor "$prev" "$sha" ||
              { echo "::error::$TAG does not contain the latest release $best"; exit 1; }
          fi
      # The committed gradle-wrapper.jar must match a checksum Gradle
      # publishes for a real release before any Gradle code runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          IFS=. read -r major minor patch <<< "$v"
          echo "SENTINELA_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "SENTINELA_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Build the generic APK (unsigned)
        env:
          SENTINELA_GENERIC_APK: "1"
          SENTINELA_APK_UNSIGNED: "1"
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: mobile/build/sentinela-unsigned.apk
          retention-days: 1

  # The only job that can read the signing key: it checks nothing out and runs
  # no project code, only the SDK's zipalign and apksigner. The key is on
  # disk for the signing command alone.
  android-sign:
    needs: android
    if: github.repository == 'LUKER2DW/Sentinela'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      # The SDK tools that sign: build-tools 35.0.0 (the version the Android
      # Gradle plugin 8.13 in mobile/android builds with) on the same Java as
      # the android jobs, never whichever the runner image has newest.
      BUILD_TOOLS: "35.0.0"
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Android build-tools ${{ env.BUILD_TOOLS }}
        shell: bash
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" >/dev/null
          fi
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign with the app's key (from the environment's secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] ||
            { echo "::error::Set ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD in the release environment (docs/RELEASING.md)"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          apk=unsigned/sentinela-unsigned.apk
          # Gradle aligns what it packs; realign only if that ever changes.
          if ! "$bt/zipalign" -c -p 4 "$apk" >/dev/null; then
            "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            apk="$RUNNER_TEMP/aligned.apk"
          fi
          mkdir -p out
          ks="$RUNNER_TEMP/android"
          install -d -m 700 "$ks"
          trap 'rm -rf "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$ks/keystore.pass"
          chmod 600 "$ks/release.jks" "$ks/keystore.pass"
          "$bt/apksigner" sign --ks "$ks/release.jks" --ks-key-alias sentinela \
            --ks-pass "file:$ks/keystore.pass" --key-pass "file:$ks/keystore.pass" \
            --out out/sentinela.apk "$apk"
          rm -rf "$ks"
          "$bt/apksigner" verify --print-certs out/sentinela.apk
      - name: app.json for the servers' update mirror
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          IFS=. read -r major minor patch <<< "$v"
          size=$(stat -c %s out/sentinela.apk)
          sha=$(sha256sum out/sentinela.apk | cut -d' ' -f1)
          printf '{"version_code":%s,"version_name":"%s","size":%s,"sha256":"%s","notes":"Sentinela %s: %s"}\n' \
            "$((major * 10000 + minor * 100 + patch))" "$v" "$size" "$sha" "$TAG" "$URL" > out/app.json
          cat out/app.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/
          retention-days: 1

  release:
    needs: android-sign
    if: github.repository == 'LUKER2DW/Sentinela'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write      # create the release
      packages: write      # push to ghcr.io
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: android-out

      - name: Checks (same as CI)
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run lint && npm test && npm run build)
          go vet ./... && go test ./...

      - name: Linux binary (web app embedded)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" -o dist/sentinela ./cmd/sentinela
          tar -C dist -czf "dist/sentinela_${VERSION}_linux_amd64.tar.gz" sentinela
          rm dist/sentinela
          cp android-out/sentinela.apk android-out/app.json dist/
          # Deploy bundle for servers that update themselves (ADR-0023). Its
          # files are recorded as root's (not the runner account's), without
          # group/other write, with the commit's time: servers run them as root.
          set -o pipefail
          # scripts/auto-update.sh installs only plain files and folders
          # named [A-Za-z0-9._-]: refuse here what every server would refuse
          # (scripts/bundle_test.go checks the same on each pull request).
          # Git quotes a name with any other character, so it cannot match.
          bad="$(git ls-files -s deploy scripts | awk '$1 != "100644" && $1 != "100755"'
            git -c core.quotePath=true ls-files deploy scripts | LC_ALL=C grep -vE '^(deploy|scripts)(/[A-Za-z0-9._-]+)+$' || true)"
          [ -z "$bad" ] || { echo "::error::the updater would refuse the deploy bundle (links or file names):"; echo "$bad"; exit 1; }
          git ls-files -z deploy scripts |
            tar --null -T - --owner=0 --group=0 --numeric-owner --mode=go-w \
              --mtime="@$(git log -1 --format=%ct)" -cf - |
            gzip -9n > "dist/sentinela_${VERSION}_deploy.tar.gz"
          tar --numeric-owner -tvzf "dist/sentinela_${VERSION}_deploy.tar.gz" | awk '$2 != "0/0" { print "::error::not root-owned: " $0; bad = 1 } END { exit bad || NR == 0 }'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/luker2dw/sentinela
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
      # GitHub stores attestations only for public repositories.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/luker2dw/sentinela
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Checksums (with the image digest servers pull by)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf 'ghcr.io/luker2dw/sentinela@%s\n' "$DIGEST" > dist/image.txt
          (cd dist && sha256sum ./*.tar.gz ./sentinela.apk ./app.json ./image.txt > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          # Release notes: this version's section of CHANGELOG.md (the
          # patch notes people read), then the full comparison link. The
          # release page keeps line breaks, so wrapped items are joined.
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md |
            awk '/^[[:space:]]*$/ && !started {next} /^  [^ ]/ {sub(/^ +/, " "); line = line $0; next} {if (started) print line; line = $0; started = 1} END {if (started) print line}' > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            [ -n "$prev" ] && printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md
            gh release create "$TAG" dist/* --verify-tag --title "Sentinela $TAG" --notes-file notes.md
          else
            # No CHANGELOG section for this tag: GitHub's own list of changes.
            gh release create "$TAG" dist/* --verify-tag --generate-notes \
              --title "Sentinela $TAG" ${prev:+--notes-start-tag "$prev"}
          fi

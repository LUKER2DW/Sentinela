# Deploy on push (ADR-0009). Runs on the home server's self-hosted runner,
# which is connected outbound to GitHub: no inbound port is opened.
# The runner user may only run the deployer (one sudoers rule); the deployer
# fetches, builds, restarts and rolls back on a failed health check.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, sentinela]
    timeout-minutes: 45
    steps:
      - name: Build and deploy on the server
        run: sudo -n /usr/local/sbin/sentinela-autodeploy --wait

# CI only (ADR-0010): checks on GitHub-hosted runners. Nothing here may
# deploy, use a self-hosted runner or hold secrets for the server.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web lint, tests and build (the Go embed needs web/dist)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run lint && npm test && npm run build
      - name: Go vet and tests
        run: go vet ./... && go test ./...
      - name: staticcheck and govulncheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

# CI only (ADR-0010): checks on GitHub-hosted runners. Nothing here may
# deploy, use a self-hosted runner or hold secrets for the server.
#
# Independent jobs run in parallel; the last one ("ci") is the single check to
# require on branches: it fails when any job failed or was skipped by mistake.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces its older run; main always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: web (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The Go packages embed web/dist, so the go job takes this build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    name: go (vet, race tests)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: gofmt and go.mod are clean
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          [ -z "$unformatted" ] || { echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; }
          go mod tidy -diff
      - run: go vet ./...
      # -race: the recorder, the controllers and the hub are concurrent code.
      - run: go test -race -count=1 ./...

  analysis:
    name: go (staticcheck, govulncheck)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  detector:
    name: detector (python tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The image's own lock, hash-checked (this also proves the lock installs).
      - run: pip install --require-hashes --no-deps -r requirements.txt
        working-directory: detector
      - run: python -m unittest -v
        working-directory: detector

  scripts:
    name: scripts (shellcheck, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck ships with the runner image.
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Workflow files: expressions, permissions, action inputs and the
      # shell inside run steps (with the runner's shellcheck).
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      # The Cloudflare Tunnel connector's loopback table
      # (scripts/lib/cloudflared.sh), loaded twice in a network namespace of
      # its own: as the confined user (nobody here) only the tunnel listener
      # and its metrics listener's answers pass; root is untouched.
      - name: tunnel loopback firewall
        run: |
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables >/dev/null; }
          # shellcheck source=scripts/lib/cloudflared.sh
          source scripts/lib/cloudflared.sh
          cf_ruleset 65534 7444 > "$RUNNER_TEMP/on.nft"
          cf_ruleset 65534 > "$RUNNER_TEMP/off.nft"
          cat > "$RUNNER_TEMP/check.sh" <<'SH'
          set -euo pipefail
          cd /
          ip link set lo up
          nft -f "$1"
          nft -f "$1"
          as() { setpriv --reuid=65534 --regid=65534 --clear-groups "$@"; }
          get() { curl -so /dev/null --max-time 5 "$@"; }
          refused() {
            local rc=0
            as curl -so /dev/null --max-time 5 "$1" || rc=$?
            [ "$rc" = 7 ] || { echo "::error::$1 as the connector: curl status $rc, want 7 (refused)"; exit 1; }
          }
          bind=127.0.0.1 v6=no
          if ip -6 addr show dev lo | grep -q '::1'; then bind=:: v6=yes; fi
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          python3 -m http.server -b "$bind" 7444 >/dev/null 2>&1 &
          python3 -m http.server -b "$bind" 1984 >/dev/null 2>&1 &
          as python3 -m http.server -b 127.0.0.1 20241 >/dev/null 2>&1 &
          for p in 7444 1984 20241; do
            for _ in $(seq 100); do get "http://127.0.0.1:$p/" && break; sleep 0.1; done
          done
          get http://127.0.0.1:1984/            # root: untouched
          get http://127.0.0.1:20241/           # the readiness check reaches its metrics
          as curl -so /dev/null --max-time 5 http://127.0.0.1:7444/   # the connector: the tunnel listener...
          refused http://127.0.0.1:1984/        # ...and no other loopback service
          if [ "$v6" = yes ]; then
            as curl -so /dev/null --max-time 5 "http://[::1]:7444/"
            refused "http://[::1]:1984/"
          fi
          nft -f "$2"                           # the proxy listener off: not even that
          refused http://127.0.0.1:7444/
          echo "tunnel loopback firewall: ok (IPv6 checked: $v6)"
          SH
          sudo unshare --net bash "$RUNNER_TEMP/check.sh" "$RUNNER_TEMP/on.nft" "$RUNNER_TEMP/off.nft"
      # The services firewall (scripts/apps-firewall.sh) in a network namespace
      # of its own: only the host's private DNS servers are reachable on port
      # 53, by rules ahead of the private-range drops; a rule slipped in ahead
      # of them, or a change of DNS servers, makes the check take the marker
      # away until the next apply.
      - name: services firewall rule order
        run: |
          cat > "$RUNNER_TEMP/fw.sh" <<'SH'
          set -euo pipefail
          t="$1"; cd "$2"
          mkdir -p "$t/apps"
          export SENTINELA_APPS_RUN="$t/run" SENTINELA_APPS_PUBLIC="$t/apps/public-ports" SENTINELA_APPS_RESOLV="$t/resolv"
          marker="$t/run/firewall-ready"
          fail() { echo "::error::$*"; iptables -S SENTINELA-APPS || true; exit 1; }
          printf 'nameserver 127.0.0.53\nnameserver 192.168.1.1\nnameserver 1.1.1.1\n' > "$t/resolv"
          iptables -N DOCKER-USER
          iptables -A DOCKER-USER -j RETURN
          iptables -A FORWARD -j DOCKER-USER
          scripts/apps-firewall.sh apply
          [ -f "$marker" ] || fail "apply wrote no marker"
          rules="$(iptables -S SENTINELA-APPS)"
          first_drop=$(awk '/-j DROP/ { print NR; exit }' <<<"$rules")
          dns=$(grep -n -- '--dport 53' <<<"$rules" || true)
          [ "$(wc -l <<<"$dns")" = 2 ] || fail "want 2 DNS rules, got: $dns"
          while IFS=: read -r n rule; do
            [[ "$rule" == *"-d 192.168.1.1/32 "* ]] || fail "DNS rule for another address: $rule"
            (( n < first_drop )) || fail "DNS rule after the private-range drops: $rule"
          done <<<"$dns"
          scripts/apps-firewall.sh check
          [ -f "$marker" ] || fail "check took the marker of a good chain"
          # Any port 53 ahead of the drops: the check refuses the chain.
          iptables -I SENTINELA-APPS 3 -i sn-+ -p udp --dport 53 -j RETURN
          scripts/apps-firewall.sh check
          [ ! -f "$marker" ] || fail "check kept the marker with DNS open to every private address"
          scripts/apps-firewall.sh apply
          [ -f "$marker" ] || fail "re-apply wrote no marker"
          # The host's DNS server changed: the old rule no longer counts.
          printf 'nameserver 192.168.1.2\n' > "$t/resolv"
          scripts/apps-firewall.sh check
          [ ! -f "$marker" ] || fail "check kept the marker after the DNS servers changed"
          scripts/apps-firewall.sh apply
          grep -q -- '-d 192.168.1.2/32 ' <<<"$(iptables -S SENTINELA-APPS)" || fail "apply did not follow the new DNS server"
          scripts/apps-firewall.sh remove
          echo "services firewall order: ok"
          SH
          sudo unshare --net bash "$RUNNER_TEMP/fw.sh" "$RUNNER_TEMP/fw" "$PWD"
      - name: docker compose file is valid (with the optional services profile)
        working-directory: deploy
        run: |
          # The file names the server's secrets file by absolute path (the example
          # holds no real secret, so it may be world-readable here).
          sudo install -D -m 0644 secrets.env.example /etc/sentinela/secrets.env
          docker compose --profile apps config --quiet
          # go2rtc's API password reaches go2rtc and serve, never the recorder
          # (which keeps the cameras' credentials).
          docker compose --profile apps config --format json | jq -e '
            (.services.recorder.environment.GO2RTC_API_PASSWORD == "")
            and (.services.recorder.environment.FRONT_PASS | length > 0)
            and (.services.sentinela.environment.GO2RTC_API_PASSWORD | length >= 20)
            and (.services.detector.environment.GO2RTC_API_PASSWORD == null)
            and (.services.apps.environment.GO2RTC_API_PASSWORD == null)'

  image:
    name: image (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds the server image the way a release does, without pushing it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: android (generic APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The committed gradle-wrapper.jar must match a checksum Gradle
      # publishes for a real release before any Gradle code runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      # The same script the release uses; with no signing key in CI it makes a
      # throwaway one, so this only proves the app still builds.
      - run: ./scripts/build-apk.sh
        env:
          SENTINELA_GENERIC_APK: "1"
      # Plain JVM tests of the app's link and session rules (app/src/test).
      - run: ./gradlew testReleaseUnitTest --no-daemon -q
        working-directory: mobile/android
        env:
          SENTINELA_GENERIC_APK: "1"

  # The one check to require: green only when every job above passed.
  ci:
    name: ci
    if: always()
    needs: [web, go, analysis, detector, scripts, image, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "::error::a CI job did not pass"; exit 1
          fi
